<title>Gifting Marketplace v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@500;600;700;800&family=Itim&display=swap">
<style>
/* Layout: a marketing site (home, catalog, product, pricing, how it works) with a sticky header and shared footer,
   a signed-in app (dashboard, send, automate, campaigns) on a pale canvas, and a branded recipient gift page.
   One light theme on purpose; pricing and how-it-works are navy pages by design. */
:root{
  color-scheme:light;
  --navy:#012754; --text:#59728F; --muted:#8398B0; --bg:#F5F8FC; --white:#FFFFFF; --line:#E2E9F2; --line-2:#D5DFEB;
  --blue:#2D6FD2; --blue-2:#4A8BE6; --blue-soft:#EAF2FB; --pink:#D6337F;
  --night:#0A1F3D; --night-2:#10294D; --night-3:#0C2242; --night-line:#24456F; --night-text:#A9BAD3; --check:#3CCB8F;
  --ok:#1E8E5A; --ok-soft:#E5F5EC; --warn:#9A5A00; --warn-soft:#FCF1DC; --info:#2D6FD2; --info-soft:#EAF2FB;
  --neutral:#3A5273; --neutral-soft:#EEF3F8; --muted-badge:#7A8CA3; --muted-soft:#F2F5F9; --danger:#C0344B; --danger-soft:#FBE8EB;
  --brand:#0E7C74; --brand-ink:#FFFFFF; --brand-soft:#E3F2F0;
  --shadow:0 1px 2px rgba(1,39,84,.05),0 10px 30px rgba(1,39,84,.08);
  --font-display:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;background:var(--white);color:var(--navy);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:99;background:var(--white)}
h1,h2,h3,h4,h5,h6{font-family:var(--font-display);margin:0;color:inherit;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(clamp(16px,4vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,40px),env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(56px,8vw,104px)}
.h2{font-size:clamp(30px,4vw,46px);font-weight:700;line-height:1.08}
.lead{font-size:17px;color:var(--text);max-width:580px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(1,39,84,.68)}
.eyebrow.dash::before{content:"";width:22px;height:2px;background:var(--pink);border-radius:2px}
.on-dark .eyebrow{color:rgba(255,255,255,.7)}
.center{text-align:center}
.muted{color:var(--text)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none}

/* Buttons and chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-2);background:var(--white);color:var(--navy);padding:10px 18px;font-weight:600;font-size:14.5px;white-space:nowrap;text-decoration:none;transition:box-shadow .15s,background .15s,transform .15s}
.btn:hover{box-shadow:var(--shadow)}
.btn.primary{background:linear-gradient(180deg,var(--blue-2),var(--blue));border-color:#2A66C2;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(45,111,210,.28)}
.btn.primary:hover{background:linear-gradient(180deg,#5A97EA,#2763C0)}
.btn.lg{padding:14px 24px;font-size:15.5px;border-radius:14px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.ghost-light{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.ghost-light:hover{background:rgba(255,255,255,.08);box-shadow:none}
.btn.white{background:#fff;border-color:#fff;color:var(--navy)}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.lnk{border:0;background:none;padding:0;color:var(--blue);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;color:var(--navy);flex:none;padding:0}
.icon-btn.sm{width:32px;height:32px}
.icon-btn:hover{box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:10px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--navy);white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600;box-shadow:inset 0 0 0 1px var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* Site header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr.dark{background:var(--night);border-bottom-color:rgba(255,255,255,.08);color:#fff}
.hdr .in{display:flex;align-items:center;gap:16px;height:66px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:inherit;white-space:nowrap;border:0;background:none;padding:0}
.logo .mk{width:32px;height:32px;border-radius:10px;background:linear-gradient(160deg,var(--blue-2),var(--blue));color:#fff;display:grid;place-items:center}
.mainnav{display:flex;align-items:center;gap:2px;margin-left:20px}
.mainnav > div{position:relative}
.navbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:500;font-size:14.5px;color:inherit;white-space:nowrap}
.navbtn:hover,.navbtn[aria-expanded="true"]{background:rgba(1,39,84,.05)}
.hdr.dark .navbtn:hover,.hdr.dark .navbtn[aria-expanded="true"]{background:rgba(255,255,255,.08)}
.hdr:not(.dark) .navbtn[aria-expanded="true"]{background:#fff;box-shadow:0 2px 12px rgba(1,39,84,.10)}
.navbtn.holiday{color:var(--pink);font-family:"Itim",var(--font-body);font-weight:400;font-size:21px;padding-block:4px}
.hdr .btn.hdr-cta{padding:10px 18px;border-radius:12px;font-size:14.5px}
.hdr .btn.hdr-cta:not(.primary){border-color:var(--line);box-shadow:0 2px 10px rgba(1,39,84,.08)}
.hdr.dark .navbtn.holiday{color:#F6C445}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hdr.dark .btn.outline-d{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.mega{position:absolute;top:calc(100% + 14px);left:0;background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:18px;box-shadow:0 28px 70px rgba(1,39,84,.18);padding:30px 32px 30px 28px;display:grid;grid-auto-flow:column;grid-auto-columns:max-content;gap:56px;z-index:85}
.mcol{display:flex;flex-direction:column;gap:30px}
.mgrp{display:flex;flex-direction:column;gap:16px}
.mega h5{font-family:var(--font-body);font-size:12px;letter-spacing:.01em;text-transform:uppercase;color:var(--text);margin:0 0 4px;font-weight:500}
.mi{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;font-size:16px;color:var(--navy);text-align:left;white-space:nowrap;border-radius:12px}
.mi .t{width:48px;height:48px;border-radius:12px;background:#F1F4F8;display:grid;place-items:center;color:var(--navy);flex:none;transition:box-shadow .15s,transform .15s}
.mi .t.purple{background:linear-gradient(160deg,#9A6BF2,#7445E0);color:#fff}
.mi .t.blue{background:linear-gradient(160deg,#5C9BEE,#2D6FD2);color:#fff}
.mi .t.bare{background:none;font-size:24px}
.mi:hover .l{color:var(--blue)}
.mi:hover .t{box-shadow:0 6px 16px rgba(1,39,84,.12);transform:translateY(-1px)}
.burger{display:none}
@media (max-width:1080px){.mainnav{display:none}.burger{display:grid}.hide-md{display:none}}
@media (max-width:520px){.hide-sm{display:none}}

/* Hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#BFD8F3 0%,#DCEAF8 52%,#F5F8FC 100%);min-height:640px}
.hero .scene{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .copy{position:relative;z-index:2;text-align:center;padding-top:78px;padding-bottom:150px;display:flex;flex-direction:column;align-items:center;gap:18px}
.hero h1{font-size:clamp(40px,6.4vw,78px);font-weight:700;line-height:1.02;max-width:920px;letter-spacing:-.035em}
.hero .sub{font-size:clamp(16px,1.6vw,19px);color:#2F4C70;max-width:620px}
.stats-card{display:grid;grid-template-columns:repeat(4,auto);gap:4px 38px;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:14px 30px;margin-top:22px;box-shadow:0 10px 30px rgba(1,39,84,.10)}
.stats-card div{display:flex;flex-direction:column;align-items:center}
.stats-card b{font-family:var(--font-display);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.stats-card span{font-size:12px;color:var(--text)}
@media (max-width:640px){.stats-card{grid-template-columns:repeat(2,auto)}.hero{min-height:0}}

/* Trust strip */
.trust{display:flex;align-items:center;gap:40px;padding-block:30px}
.trust .lbl{font-size:13.5px;color:var(--text);white-space:nowrap}
.trust .logos{display:flex;gap:20px 44px;align-items:center;flex-wrap:wrap;flex:1;justify-content:space-between}
.wm{display:inline-flex;align-items:center;gap:7px;color:#4F6380;font-weight:700;font-size:17px;white-space:nowrap;opacity:.85}
@media (max-width:760px){.trust{flex-direction:column;align-items:flex-start;gap:16px}}

/* Choice preview */
.bg-soft{background:var(--bg)}
.preview{background:#fff;border-radius:24px;box-shadow:0 24px 70px rgba(1,39,84,.10);border:1px solid var(--line);overflow:hidden;margin-top:44px}
.pv-top{display:flex;align-items:center;gap:8px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-tabs{display:flex;gap:4px;padding:6px 18px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.pv-tab{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:11px 12px;font-size:13.5px;color:var(--text);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.pv-tab:hover{color:var(--navy)}
.pv-tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--pink);font-weight:600}
.pv-body{padding:34px clamp(18px,5vw,64px) 40px}
.greet{font-size:clamp(28px,3.2vw,40px);font-weight:700}
.dtiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}
.dtile{border:0;background:none;padding:0;text-align:center;display:flex;flex-direction:column;gap:10px;color:var(--navy)}
.dtile .t{aspect-ratio:1.18;border-radius:18px;background:#EEF3FA;display:grid;place-items:center;transition:transform .2s,box-shadow .2s}
.dtile .t svg{width:58%;height:auto}
.dtile.hl .t{background:linear-gradient(160deg,#9CC2F3,#4A8BE6)}
.dtile:hover .t{transform:translateY(-3px);box-shadow:0 14px 28px rgba(1,39,84,.12)}
.dtile span{font-size:13.5px;font-weight:500;display:inline-flex;gap:4px;align-items:center;justify-content:center}
@media (max-width:760px){.dtiles{grid-template-columns:repeat(3,minmax(0,1fr))}.dtile.hl{grid-column:span 2}}
@media (max-width:460px){.dtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Carousels and cards */
.car{display:grid;grid-auto-flow:column;grid-auto-columns:var(--cw,260px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:2px 2px 6px}
.car > *{scroll-snap-align:start}
.car-ctl{display:flex;align-items:center;gap:16px;margin-top:28px}
.prog{flex:1;height:3px;background:var(--line-2);border-radius:3px;position:relative;overflow:hidden}
.prog i{position:absolute;top:0;bottom:0;left:0;background:var(--navy);border-radius:3px;width:30%;transition:left .2s}
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 10px 18px;display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0;transition:box-shadow .2s,transform .2s;color:var(--navy)}
.pc:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.pc[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.pc .img{background:var(--bg);border-radius:12px;aspect-ratio:1;display:grid;place-items:center;margin-bottom:8px;position:relative}
.pc .img svg{width:80%;height:80%}
.pc .br{font-size:12px;color:var(--text);padding:0 6px}
.pc .nm{font-size:15px;font-weight:500;line-height:1.35;padding:0 6px}
.pc .more{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);padding:0 6px}
.pc .pr{font-family:var(--font-display);font-weight:600;padding:2px 6px 0}
.pc .tag{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#fff;border-radius:6px;padding:3px 7px;color:var(--navy)}
.ccard{border:1px solid var(--line);background:#fff;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0;color:var(--navy);transition:box-shadow .2s}
.ccard:hover{box-shadow:var(--shadow)}
.ccard[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.mos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--bg);border-radius:12px;padding:8px}
.mos span{aspect-ratio:1;display:grid;place-items:center;background:#fff;border-radius:8px}
.mos span svg{width:92%;height:92%}
.ccard b{font-size:14px;padding:0 4px}
.ccard small{font-size:12.5px;color:var(--text);padding:0 4px 4px;margin-top:-6px}
.build-card{border:1.5px dashed var(--blue);background:var(--blue-soft);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;color:var(--blue);font-weight:600;min-height:180px}
.build-card .plus{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}

/* Collections tiles */
.ctile{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px;color:var(--navy)}
.ctile .scene{position:relative;aspect-ratio:.86;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.9) 0 2px,transparent 3px) 0 0/42px 42px,radial-gradient(circle at 70% 60%,rgba(255,255,255,.75) 0 1.5px,transparent 2.5px) 0 0/34px 34px,linear-gradient(180deg,#9DC2EC,#D6E7F8 66%,#F2F7FD)}
.ctile .scene::after{content:"";position:absolute;left:-12%;right:-12%;bottom:-20%;height:44%;background:#fff;border-radius:50%}
.ctile .scene svg{position:absolute;z-index:1}
.ctile b{font-weight:500;font-size:16px}
.ctile:hover .scene{box-shadow:var(--shadow)}

/* How it works (home) */
.hiw{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.hiw-l{display:flex;flex-direction:column}
.hiw-l .hd{padding:26px 28px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hiw-l .hd h2{font-size:24px;font-weight:700}
.hstep{border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:none;text-align:left;padding:18px 28px 18px 25px;display:flex;flex-direction:column;gap:5px;color:var(--navy)}
.hstep small{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.hstep b{font-size:16px;font-weight:600}
.hstep p{display:none;color:var(--text);font-size:14px}
.hstep[aria-selected="true"]{background:var(--bg);border-left-color:var(--blue)}
.hstep[aria-selected="true"] p{display:block}
.hiw-l .ft{padding:18px 28px}
.hiw-r{background:radial-gradient(500px 300px at 80% 0%,rgba(255,255,255,.25),transparent 70%),linear-gradient(160deg,#6A9DE6,#1F4E95);position:relative;min-height:440px;display:grid;place-items:center;padding:32px;overflow:hidden}
.glass{background:rgba(255,255,255,.92);border-radius:16px;box-shadow:0 20px 50px rgba(1,20,60,.3);padding:16px}
@media (max-width:900px){.hiw{grid-template-columns:1fr}.hiw-r{min-height:340px}}

/* AI box */
.ai{background:linear-gradient(135deg,#EEE8FB 0%,#E8F1FB 50%,#E3F6EF 100%)}
.ai-box{max-width:780px;margin:34px auto 0;border-radius:18px;padding:2px;background:linear-gradient(90deg,#7FB0F0,#B58CF0,#F07FB5)}
.ai-box .in{background:#fff;border-radius:16px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px}
.ai-box textarea{border:0;outline:none;resize:none;min-height:86px;font-size:15.5px;background:transparent}
.gen{align-self:flex-end;background:linear-gradient(90deg,#4A8BE6,#9A6BE8);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.ex{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--navy)}
.ex:hover{box-shadow:var(--shadow)}
.ai-res{max-width:1000px;margin:32px auto 0}

/* Swag */
.swag{background:linear-gradient(180deg,#E2D7F6,#F4EFFC)}
.swag-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:230px 230px;gap:10px;margin-top:44px;border-radius:24px;overflow:hidden}
.swag-grid > div{display:grid;place-items:center;position:relative}
.swag-grid svg{height:78%;width:auto}
.swag-grid .a{grid-row:span 2}
.swag-grid .d{grid-column:span 2}
.swag-grid .lbl{position:absolute;left:16px;bottom:14px;font-size:12px;font-weight:600;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 10px}
@media (max-width:760px){.swag-grid{grid-template-columns:1fr 1fr;grid-template-rows:200px 200px 200px}.swag-grid .a{grid-row:auto;grid-column:span 2}.swag-grid .d{grid-column:span 2}}

/* Enterprise */
.ent{background:var(--navy);color:#fff}
.ent-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.ent h2{font-size:clamp(30px,3.8vw,44px);font-weight:700;line-height:1.1;color:#fff}
.feat{display:grid;grid-template-columns:26px 1fr;gap:4px 14px;padding:20px 0;border-top:1px solid rgba(255,255,255,.14)}
.feat:first-child{border-top:0}
.feat .ic{margin-top:2px;color:#9EC0F0}
.feat b{font-weight:600}
.feat span{grid-column:2;color:var(--night-text);font-size:14px}
@media (max-width:900px){.ent-grid,.api-grid{grid-template-columns:1fr;gap:36px}}

/* API */
.api-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.api-grid h2{font-size:clamp(30px,3.8vw,46px);font-weight:700;line-height:1.08}
.tagchip{font-size:12px;font-weight:600;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 10px;color:var(--navy)}
.code{background:#0B1220;border-radius:16px;box-shadow:0 30px 60px rgba(1,39,84,.25);overflow:hidden;min-width:0}
.code .bar{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:#7C8BA5}
.code .bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.code pre{margin:0;padding:20px;min-height:330px;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:#C9D6EA;white-space:pre-wrap;overflow-wrap:anywhere}

function aiSuggest(q){
  q=q.toLowerCase();const want={occ:[],tags:[],cats:[]};let cap=0;
  const m=q.match(/\$\s?(\d+)/)||q.match(/(\d+)\s?(dollars|usd)/);if(m)cap=+m[1]*100;
  const map=[[/holiday|christmas|season|festive/,'occ','holiday'],[/birthday|bday/,'occ','birthday'],[/thank|appreciat|client|customer/,'occ','thanks'],[/anniversar|years/,'occ','anniversary'],[/new hire|welcome|onboard|first day/,'occ','newhire'],[/tea|coffee|drink|mug/,'tags','drink'],[/hik|outdoor|camp|trail|run|walk/,'tags','outdoors'],[/cozy|home|candle|relax|calm/,'tags','home'],[/cookie|sweet|snack|treat|food|baking/,'tags','food'],[/wellness|health|fit/,'tags','wellness'],[/team|share|everyone|office/,'tags','team']];
  const why=[];for(const [re,k,v] of map)if(re.test(q)){want[k].push(v);why.push(v);}
  const scored=PRODUCTS.filter(activeP).filter(p=>!cap||p.price<=cap).map(p=>({p,s:want.occ.filter(o=>p.occ.includes(o)).length*2+want.tags.filter(t=>p.tags.includes(t)).length*3})).filter(x=>x.s>0||!why.length).sort((a,b)=>b.s-a.s||b.p.price-a.p.price).slice(0,4);
  return{list:scored.map(x=>x.p),why,cap};
}

  if(i===1)return `<div style="width:min(860px,100%)"><div style="display:flex;gap:10px;overflow-x:auto;padding:12px;background:rgba(255,255,255,.08);border-radius:18px">${[['19','SAT','7 gifts claimed'],['20','TODAY','Start a campaign'],['22','MON','Mei Malik · birthday'],['24','WED','Team offsite'],['27','SAT','2 anniversaries'],['3','TUE','Ravi’s first day']].map(([d,w,t],k)=>`<div style="min-width:132px;background:#fff;color:var(--navy);border-radius:12px;padding:12px;text-align:left;${k===1?'outline:2px solid #4A8BE6':''}"><div class="small" style="color:var(--text)"><b style="font-size:18px;color:${k===1?'#fff':'var(--navy)'};${k===1?'background:#2D6FD2;border-radius:50%;padding:2px 7px':''}">${d}</b> ${w}</div><div class="small" style="margin-top:8px">${t}</div></div>`).join('')}</div>
    ${mini('Automate gifting',`<div class="wizard" style="justify-content:flex-start;margin-bottom:14px"><button type="button" aria-current="step" tabindex="-1"><span class="n">1</span>Setup</button><button type="button" tabindex="-1"><span class="n">2</span>Personalize</button><button type="button" tabindex="-1"><span class="n">3</span>Recipients</button></div>${AUTO_TYPES.slice(0,3).map((t,k)=>`<div class="radio-card" style="margin-bottom:8px;padding:10px" aria-pressed="${k===0}"><span class="dot"></span><span><b class="small">${t.l}</b><span class="small muted" style="display:block">${t.d}</span></span></div>`).join('')}`).replace('class="device"','class="device" style="margin:20px auto 0"')}</div>`;
  if(i===2)return `${mini('Personalize',`<div class="grid2" style="gap:12px"><div class="stack" style="gap:8px"><span class="small muted">Card design</span><div class="swatches">${COVERS.map((c,k)=>`<span class="swatch cover-${c.key}" style="width:52px;height:38px;${k===0?'border-color:#2D6FD2':''}"></span>`).join('')}</div><span class="small muted">Message</span><div class="input small" style="min-height:70px">Thank you for everything you put into this year…</div></div>${gcard({cover:'snow',title:'Happy holidays',message:'Thank you for everything you put into this year.',from:'Maya Chen'})}</div>`)}`;
  if(i===3)return `${mini('Delivery',`<div class="chan-grid">${CHANNELS.map((c,k)=>`<div class="chan" aria-pressed="${k<3}">${ic(c.icon,18)}<span><b>${c.label}</b><span class="small muted">${c.note}</span></span></div>`).join('')}</div><div class="alert" style="background:var(--ok-soft);color:var(--ok);margin-top:12px">${ic('check',18)}<span><b>No addresses needed</b>Recipients add their own when they choose.</span></div>`)}`;
  return `${mini('Q4 thank-you',`<div class="stats4" style="gap:8px;grid-template-columns:repeat(4,1fr)">${[['Sent','40'],['Opened','34'],['Chose','26'],['Spent','$875']].map(([l,v])=>`<div class="stat" style="padding:10px"><span class="l">${l}</span><span class="v" style="font-size:20px">${v}</span></div>`).join('')}</div><div class="seg" style="margin-top:14px"><i class="s-delivered" style="width:35%"></i><i class="s-shipped" style="width:15%"></i><i class="s-chose" style="width:15%"></i><i class="s-opened" style="width:20%"></i><i class="s-sent" style="width:15%"></i></div><div class="legend" style="margin-top:10px">${[['delivered','Delivered'],['shipped','Shipped'],['chose','Chose'],['opened','Opened'],['sent','Not opened']].map(([k,l])=>`<span><i class="s-${k}"></i>${l}</span>`).join('')}</div>`)}`;
}

  ${STEPS.map((s,i)=>`<section class="hstep-sec" id="step-${i}" data-step="${i}"><div class="wrap"><h2>${s.t}</h2><h3>${s.s}</h3><p class="d">${s.d}</p><button type="button" class="btn white" style="margin-top:24px" data-act="go" data-r="${s.cta[1]}">${s.cta[0]}</button><div class="devices">${stepVisual(i)}</div></div></section>`).join('')}

    ['What is Gifting Marketplace?','A platform for sending gifts at scale. Companies fund team budgets, pick a collection or a single gift, and send it by email, text, Slack, Teams, a link or a QR code. Recipients choose and the vendor ships.'],
    ['Can I automate gifts?','Yes. Connect your HR system or upload a CSV, and gifts go out on birthdays, work anniversaries and first days. Each person gets one gift per occasion, even if the sync runs twice.'],
    ['Do I need the recipient’s address?','No. Recipients enter their own address when they choose a gift. It goes to the vendor that ships it, and your company never sees it.'],
    ['How does billing work?','You top up a team budget by card or invoice. When a gift goes out we hold its budget; when someone chooses, we charge the real price and release the rest. Unclaimed gifts release their hold when they expire.'],
    ['What happens if an item sells out?','The recipient is sent back to choose again. Stock and price are re-checked at the moment they choose.'],
  ].map(([q,a],k)=>`<details ${k===0?'open':''}><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></section></main>${footer()}`;

/* Send flow */
const perGift=s=>s.mode==='single'&&s.sku?prod(s.sku).price:s.budget;
const giftLabel=s=>s.mode==='single'?(s.sku?prod(s.sku).name:'No gift picked'):`${coll(s.collection).name}, up to ${money(s.budget)}`;
function gcard(g){return `<div class="gcard"><div class="cover cover-${g.cover}"><span class="title">${esc(g.title||' ')}</span></div><div class="msg">${esc(g.message)}</div><div class="from">From ${esc(g.from||'…')}, Lumen Labs</div></div>`;}
function stepValid(i){const s=S.send;if(i===0)return s.mode==='single'?!!s.sku:itemsFor(s.collection,s.budget).length>0;if(i===1)return !!(s.title.trim()&&s.from.trim()&&s.message.trim());if(i===2)return s.recipients.length>0&&s.channels.length>0;return true;}
function pageSend(){
  const s=S.send;if(s.done)return appShell(sendDone());
  const steps=['Gift','Personalize','Recipients','Review & send'];
  const n=s.recipients.length,hold=n*perGift(s),t=team(),b=bal(S.team),needs=hold>t.threshold,short=hold>b.available;
  const next=s.step<3?'Continue':needs?'Submit for approval':s.when==='later'?`Schedule ${n} gift${n===1?'':'s'}`:`Send ${n} gift${n===1?'':'s'}`;
  const summary=s.step===0?esc(giftLabel(s)):s.step===2?`${n} recipient${n===1?'':'s'} · ${esc(chanLabels(s.channels))}`:`${esc(giftLabel(s))} · ${n} recipient${n===1?'':'s'}`;
  return appShell(`<div class="between"><div class="stack" style="gap:4px"><span class="eyebrow">New send · ${esc(t.name)} team</span><h1 class="app-title">Send Gifts</h1></div><nav class="wizard" aria-label="Steps">${steps.map((l,i)=>`<button type="button" data-act="send-step" data-i="${i}" ${i===s.step?'aria-current="step"':''} class="${i<s.step?'done':''}" ${i>s.step?'disabled':''}><span class="n">${i<s.step?ic('check',13):i+1}</span>${l}</button>`).join('')}</nav></div>
  <section class="panel stack" style="gap:24px">${[sendGift,sendPersonal,sendRecipients,sendReview][s.step]()}</section>
  <div class="actionbar"><span class="small"><span class="muted">Selected:</span> <b>${summary}</b></span><div class="row" style="gap:8px"><button type="button" class="btn" data-act="send-back" ${s.step===0?'disabled':''}>${ic('chev-l',15)} Back</button><button type="button" class="btn primary" data-act="send-next" id="send-next" ${!stepValid(s.step)||(s.step===3&&short)?'disabled':''}>${next} ${s.step<3?ic('arrow',15):''}</button></div></div>`);
}
function sendGift(){const s=S.send;
  const sc=PRODUCTS.filter(p=>activeP(p)&&p.price<=s.budget&&(s.scat==='all'||p.cat===s.scat)&&(!s.sq||(p.name+' '+p.brand).toLowerCase().includes(s.sq.toLowerCase())));
  const cols=COLLECTIONS.map(c=>({c,its:itemsFor(c.id,s.budget)})).filter(x=>x.its.length);
  return `<div class="grid2"><button type="button" class="choice" data-act="send-mode" data-v="single" aria-pressed="${s.mode==='single'}"><span class="ill">${DTILE_ART.browse}</span><span><b>Sender's Choice</b><span class="small muted">Choose one gift yourself, for a personal touch.</span></span></button>
    <button type="button" class="choice" data-act="send-mode" data-v="collection" aria-pressed="${s.mode==='collection'}"><span class="ill">${DTILE_ART.coll}</span><span><b>Recipient's Choice</b><span class="small muted">Let them pick their favourite from a collection.</span></span></button></div>
  <div class="row" style="gap:16px"><label class="field" style="width:180px"><span class="flabel">Ship to</span><select class="input" data-ch="send-country"><option value="US" ${s.country==='US'?'selected':''}>🇺🇸 United States</option><option value="CA" ${s.country==='CA'?'selected':''}>🇨🇦 Canada</option></select></label>
    <label class="field" style="width:180px"><span class="flabel">Budget</span><select class="input" data-ch="send-budget">${[2500,5000,7500,10000].map(v=>`<option value="${v}" ${s.budget===v?'selected':''}>${money(v)}</option>`).join('')}</select></label></div>
  ${s.mode==='collection'?`<div class="between"><h2 style="font-size:20px">Gift Collections (${cols.length})</h2><span class="small muted">Each collection shows what fits ${money(s.budget)}</span></div>
    <div class="cgrid"><button type="button" class="build-card" data-act="new-collection"><span class="plus">${ic('plus',22)}</span>Build Your Own Collection</button>${cols.map(({c,its})=>`<button type="button" class="ccard" data-act="send-col" data-id="${c.id}" aria-pressed="${s.collection===c.id}">${mos(its)}<b>${esc(c.name)}</b><small>${its.length} gifts from ${new Set(its.map(p=>p.brand)).size} brands</small></button>`).join('')}</div>`
  :`<div class="between"><div class="chips">${[['all','All Products'],...CATS.map(c=>[c.key,c.label])].map(([k,l])=>`<button type="button" class="chip" data-act="send-scat" data-v="${k}" aria-pressed="${s.scat===k}">${l}</button>`).join('')}</div><div class="searchpill" style="margin-left:0">${ic('search',16)}<input id="f-ssearch" type="search" placeholder="Search a product by name…" aria-label="Search products" value="${esc(s.sq)}" data-in="send-sq"></div></div>
    <div class="pgrid" id="send-grid">${sc.map(p=>pc(p,{act:'send-sku',pressed:s.sku===p.sku,price:true,tags:true})).join('')||'<p class="muted">Nothing fits this budget and filter.</p>'}</div>`}`;}
function sendPersonal(){const s=S.send;
  return `<div class="grid2" style="gap:32px;align-items:start"><div class="stack" style="gap:20px"><h2 style="font-size:22px">Personalize the experience</h2>
    <div class="stack" style="gap:10px"><span class="flabel">Occasion</span><div class="chips">${OCCASIONS.map(o=>`<button type="button" class="chip" data-act="send-occ" data-v="${o.key}" aria-pressed="${s.occasion===o.key}">${ic(o.icon,15)}${o.label}</button>`).join('')}</div></div>

function peopleList(){const s=S.send,q=S.rsearch.toLowerCase();const l=DIRECTORY.filter(p=>!q||(p.name+' '+p.email+' '+p.dept).toLowerCase().includes(q));

function sendRecipients(){const s=S.send,n=s.recipients.length;
  return `<div class="grid2" style="gap:32px;align-items:start"><div class="stack" style="gap:14px"><div class="between"><h2 style="font-size:22px">Recipients <span class="muted" style="font-weight:500;font-size:16px">· ${n} selected</span></h2><div class="row" style="gap:8px"><button type="button" class="btn sm" data-act="send-all">${n===DIRECTORY.length?'Clear all':'Select all'}</button><button type="button" class="btn sm" data-act="send-csv">${ic('upload',15)} Upload CSV</button></div></div>
    <div class="searchpill" style="margin-left:0;flex:none;width:100%">${ic('search',16)}<input id="f-rsearch" type="search" placeholder="Search the Lumen Labs directory" aria-label="Search the directory" value="${esc(S.rsearch)}" data-in="r-search"></div>

    <div class="field"><label for="f-add">Add someone by email</label><div class="row" style="flex-wrap:nowrap;gap:8px"><input id="f-add" class="input" type="email" placeholder="name@company.example" data-enter="add-email"><button type="button" class="btn" data-act="add-email">Add</button></div><span class="err" id="add-err" hidden></span></div></div>

    <div class="chan-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${CHANNELS.map(c=>`<button type="button" class="chan" data-act="send-chan" data-v="${c.key}" aria-pressed="${s.channels.includes(c.key)}">${ic(c.icon,20)}<span><b>${c.label}</b><span class="small muted">${c.note}</span></span></button>`).join('')}</div>
    <div class="grid2"><div class="stack" style="gap:8px"><span class="flabel">When</span><div class="chips"><button type="button" class="chip" data-act="send-when" data-v="now" aria-pressed="${s.when==='now'}">Send now</button><button type="button" class="chip" data-act="send-when" data-v="later" aria-pressed="${s.when==='later'}">${ic('calendar',15)} Schedule</button></div>${s.when==='later'?`<input type="date" class="input" aria-label="Send date" min="2026-10-28" value="${s.date}" data-ch="send-date">`:''}</div>
      <div class="field"><label for="f-exp">Expires after</label><select id="f-exp" class="input" data-ch="send-expiry">${[30,60,90].map(d=>`<option value="${d}" ${s.expiry===d?'selected':''}>${d} days (${fmtDate(addDays(d))})</option>`).join('')}</select></div></div>

function sendReview(){const s=S.send,n=s.recipients.length,per=perGift(s),hold=n*per,t=team(),b=bal(S.team),needs=hold>t.threshold,short=hold>b.available;
  const defName=`${occ(s.occasion).label} · ${fmtDate(s.when==='later'?s.date:TODAY)}`;

function sendDone(){const s=S.send,d=s.done;const share=(s.channels.includes('link')||s.channels.includes('qr'))&&!d.needs;

function submitSend(){const s=S.send,n=s.recipients.length,per=perGift(s),hold=n*per,t=team(),needs=hold>t.threshold;
  const status=needs?'pending approval':s.when==='later'?'scheduled':'sent';const name=s.cname.trim()||`${occ(s.occasion).label} · ${fmtDate(s.when==='later'?s.date:TODAY)}`;const cid='cmp-'+rand(5).toLowerCase();
  const people=s.recipients.map(id=>DIRECTORY.find(p=>p.id===id));
  CAMPAIGNS.unshift({id:cid,name,team:S.team,type:s.when==='later'?'Scheduled · '+fmtDate(s.date):'One-time',collection:s.mode==='collection'?s.collection:null,sku:s.mode==='single'?s.sku:null,budget:per,channels:[...s.channels],created:fmtDate(TODAY),status:needs?'pending approval':s.when==='later'?'scheduled':'active',gifts:people.map((p,i)=>({id:'g_'+rand(6),name:p.name,email:p.email,status,channel:s.channels[i%s.channels.length],sku:null}))});
  if(status==='sent')LEDGER[S.team].push({type:'hold',amount:-hold});
  s.done={cid,needs,n,hold,status,token:linkToken()};
  S.lastGift={from:s.from,title:s.title,message:s.message,cover:s.cover,collection:s.mode==='collection'?s.collection:null,budget:per,sku:s.mode==='single'?s.sku:null,recipient:people[0].name.split(' ')[0],expiry:s.expiry,cid};S.rec=null;
  toast(needs?`Approval requested from ${team().approver}.`:status==='scheduled'?`${n} gifts scheduled.`:`${n} gifts sent. ${money(hold)} held.`);}
function drawQR(){const cv=$('#qr');if(!cv)return;const ctx=cv.getContext('2d'),N=29,q=2,cell=cv.width/(N+q*2);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  let seed=[...S.send.done.token].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;const finder=(x,y)=>x<8&&y<8||x>=N-8&&y<8||x<8&&y>=N-8;ctx.fillStyle='#012754';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(finder(x,y))continue;if(rnd()<.48)ctx.fillRect((x+q)*cell,(y+q)*cell,cell+.5,cell+.5);}
  for(const [fx,fy] of [[0,0],[N-7,0],[0,N-7]]){const px=(fx+q)*cell,py=(fy+q)*cell;ctx.fillStyle='#012754';ctx.fillRect(px,py,7*cell,7*cell);ctx.fillStyle='#fff';ctx.fillRect(px+cell,py+cell,5*cell,5*cell);ctx.fillStyle='#012754';ctx.fillRect(px+2*cell,py+2*cell,3*cell,3*cell);}}

function renderModal(){const root=$('#modal-root');if(!S.modal){root.innerHTML='';return;}

let RT={raf:0,timers:[],obs:null};
function stopFx(){cancelAnimationFrame(RT.raf);clearInterval(RT.hiwT);RT.timers.forEach(clearInterval);RT.timers=[];if(RT.obs){RT.obs.disconnect();RT.obs=null;}}
const ROUTES={home:pageHome,catalog:pageCatalog,product:pageProduct,pricing:pagePricing,how:pageHow,dash:pageDash,send:pageSend,campaigns:pageCampaigns,automate:pageAutomate,gift:pageGift};
function render(){stopFx();$('#root').innerHTML=ROUTES[S.route]();renderPages();renderModal();afterRender();}
function afterRender(){

  if(S.route==='home'){startSnow();startCode();if(!reduced)RT.hiwT=setInterval(()=>{if(document.hidden)return;S.hiw=(S.hiw+1)%HIW.length;const h=$('#hiw');if(h)h.innerHTML=hiwHTML();},6000);}
  if(S.route==='how'&&'IntersectionObserver' in window){RT.obs=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){const i=e.target.dataset.step;document.querySelectorAll('#steps-nav button').forEach((b,k)=>b.setAttribute('aria-current',String(k==i)));}},{rootMargin:'-45% 0px -50% 0px'});document.querySelectorAll('.hstep-sec').forEach(s=>RT.obs.observe(s));}
}
function go(r,opts={}){S.route=r;S.menu=null;S.pages=false;S.modal=null;if(r==='send'&&(!S.send||S.send.done||opts.fresh))S.send=freshSend(opts.pre||{});if(r==='campaigns'&&!opts.keepCampaign)S.campaign=null;if(r==='automate')S.auto=null;render();window.scrollTo({top:0,behavior:'instant'});}
function updProg(car){const bar=document.querySelector(`[data-prog="${car.id}"] i`);if(!bar)return;const max=car.scrollWidth-car.clientWidth;const w=car.scrollWidth?car.clientWidth/car.scrollWidth*100:100;bar.style.width=Math.min(100,w)+'%';bar.style.left=(max>0?car.scrollLeft/max*(100-w):0)+'%';}
function startSnow(){const cv=$('#snow');if(!cv||reduced)return;const ctx=cv.getContext('2d');let W,H;const fit=()=>{W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;};fit();
  const flakes=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.8,s:Math.random()*.6+.3,d:Math.random()*1.5}));
  const tick=t=>{if(!cv.isConnected)return;if(cv.offsetWidth!==W)fit();ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.9)';for(const f of flakes){f.y+=f.s;f.x+=Math.sin(t/1600+f.d)*.3;if(f.y>H){f.y=-4;f.x=Math.random()*W;}ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill();}RT.raf=requestAnimationFrame(tick);};RT.raf=requestAnimationFrame(tick);}
function startCode(){const el=$('#code');if(!el)return;const total=CODE.reduce((a,[,t])=>a+t.length,0);if(reduced){el.innerHTML=codeHTML(total);return;}let n=0;
  const run=()=>{const id=setInterval(()=>{n+=2;el.innerHTML=codeHTML(n);if(n>=total){clearInterval(id);}},22);RT.timers.push(id);};
  if('IntersectionObserver' in window){const o=new IntersectionObserver(es=>{if(es[0].isIntersecting){o.disconnect();run();}});o.observe(el);}else run();}

  'auto-cancel'(){S.auto=null;render();},
  'rec-reset'(){S.rec=freshRec();render();scrollTo({top:0});},
  'rec-open'(){const b=$('#gbox');if(reduced||!b){S.rec.opened=true;render();return;}b.classList.add('open');setTimeout(()=>{S.rec.opened=true;render();},700);},
  'rec-goto'(d){const r=S.rec,i=+d.i;if(i===2){const p=prod(r.sku);if(p.variants&&!r.variant)return;}r.step=i;render();scrollTo({top:0});},
  'rec-item'(d){const p=prod(d.sku);S.rec.sku=d.sku;S.rec.variant=null;render();scrollTo({top:0});},
  'rec-unpick'(){S.rec.sku=null;S.rec.variant=null;render();},
  'rec-variant'(d){S.rec.variant=d.v;render();},
  'rec-submit'(){const r=S.rec,a=r.addr,e={};if(!a.name.trim())e.name='Add the name for the parcel.';if(!a.line1.trim())e.line1='Add a street address.';if(!a.city.trim())e.city='Add a city.';if(!a.region.trim())e.region='Add a state.';
    if(!/^(\d{5}(-\d{4})?|[A-Za-z]\d[A-Za-z] ?\d[A-Za-z]\d)$/.test(a.postal.trim()))e.postal=a.country==='CA'?'Use a postal code like M5R 2A5.':'Use a 5-digit ZIP code.';
    r.errors=e;if(Object.keys(e).length){render();$('#ra-'+Object.keys(e)[0]).focus();return;}r.placing=true;render();setTimeout(()=>{placeOrder();if(S.route==='gift')render();toast('Order placed. The vendor has it now.');},reduced?0:900);},
  'step-jump'(d){const s=$('#step-'+d.i);s&&s.scrollIntoView({behavior:reduced?'auto':'smooth'});},
  'modal-close'(){closeModal();},
  'modal-scrim'(d,el,e){if(e.target===el)closeModal();},
};

function addEmail(){const inp=$('#f-add'),err=$('#add-err'),v=inp.value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){err.textContent='Enter an email address like name@company.example.';err.hidden=false;inp.setAttribute('aria-invalid','true');inp.focus();return;}
  let p=DIRECTORY.find(x=>x.email===v);if(!p){p={id:'p'+DIRECTORY.length,name:v.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),email:v,dept:'Added'};DIRECTORY.push(p);}
  if(!S.send.recipients.includes(p.id))S.send.recipients.push(p.id);render();toast(`${p.name} added.`);const n=$('#f-add');n&&n.focus();}
const IN={
  'cat-q'(el){S.cat.q=el.value;catRefresh();},
  'send-sq'(el){S.send.sq=el.value;const s=S.send;const sc=PRODUCTS.filter(p=>activeP(p)&&p.price<=s.budget&&(s.scat==='all'||p.cat===s.scat)&&(!s.sq||(p.name+' '+p.brand).toLowerCase().includes(s.sq.toLowerCase())));$('#send-grid').innerHTML=sc.map(p=>pc(p,{act:'send-sku',pressed:s.sku===p.sku,price:true,tags:true})).join('')||'<p class="muted">Nothing fits this budget and filter.</p>';},
  'send-text'(el){S.send[el.dataset.k]=el.value;const mc=$('#msg-count');if(mc&&el.dataset.k==='message')mc.textContent=el.value.length+' / 500';const pv=$('#send-prev');if(pv)pv.innerHTML=gcard(S.send);const nb=$('#send-next');if(nb)nb.disabled=!stepValid(S.send.step);},
  'r-search'(el){S.rsearch=el.value;$('#people').innerHTML=peopleList();},
  'auto-text'(el){S.auto[el.dataset.k]=el.value;const a=S.auto;$('#auto-prev').innerHTML=gcard({cover:'confetti',title:a.title,message:a.message.replace('{first_name}','Noor').replace('{years}','3'),from:'The People team'});},
  'rec-addr'(el){S.rec.addr[el.dataset.k]=el.value;if(S.rec.errors[el.dataset.k]){delete S.rec.errors[el.dataset.k];el.removeAttribute('aria-invalid');const e=$('#re-'+el.dataset.k);e&&e.remove();}},
  'm-name'(el){S.modal.name=el.value;renderModal();},
};
const CH={
  'cat-tick'(el){const k=el.dataset.k,a=S.cat[k];if(el.checked){if(!a.includes(el.value))a.push(el.value);}else S.cat[k]=a.filter(x=>x!==el.value);catRefresh();},
  'cat-budget'(el){S.cat.budget=+el.value;catRefresh();},
  'cat-country'(el){S.cat.country=el.value;catRefresh();},
  'cat-sort'(el){S.cat.sort=el.value;catRefresh();},
  team(el){S.team=el.value;S.campaign=null;render();},
  'send-country'(el){S.send.country=el.value;},
  'send-budget'(el){S.send.budget=+el.value;if(S.send.sku&&prod(S.send.sku).price>S.send.budget)S.send.sku=null;render();},
  'send-date'(el){S.send.date=el.value;render();},
  'send-expiry'(el){S.send.expiry=+el.value;render();},
  'auto-col'(el){S.auto.collection=el.value;render();},
  'auto-time'(el){S.auto.timing=el.value;render();},
  'rec-country'(el){S.rec.addr.country=el.value;},
};
document.addEventListener('click',e=>{
  if(S.menu&&!e.target.closest('.mega')&&!e.target.closest('[data-act="menu"]')){S.menu=null;const h=$('#hdr');if(h)h.outerHTML=siteHeader(h.classList.contains('dark'));}
  if(S.pages&&!e.target.closest('.pages-menu')&&!e.target.closest('.pages-btn')&&!e.target.closest('.burger')){S.pages=false;renderPages();}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn)fn(el.dataset,el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e);});
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('car'))updProg(t);},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal){closeModal();return;}if(S.menu){S.menu=null;const h=$('#hdr');if(h)h.outerHTML=siteHeader(h.classList.contains('dark'));}if(S.pages){S.pages=false;renderPages();}}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter==='add-email'){e.preventDefault();addEmail();}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('tr.click'))e.target.closest('tr.click').click();
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&e.target.id==='ai-q')ACT['ai-go']();
});

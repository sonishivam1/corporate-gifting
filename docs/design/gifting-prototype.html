<title>Gifting Marketplace Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: a sticky app switcher, then one of four apps. Sender is sidebar + soft-blue canvas;
   recipient is a branded phone frame; vendor and ops are full-width tables. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --bg-glow:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F8FC;
  --ink:#012754; --ink-2:#59728F; --ink-3:#8398B0; --line:#E2E9F2;
  --accent:#2570C5; --accent-hover:#1C5CA6; --accent-ink:#FFFFFF; --accent-soft:#EAF2FB;
  --pop:#59728F;
  --ok:#147A55; --ok-soft:#E6F4EE; --warn:#8A5300; --warn-soft:#FBF1DE; --info:#2570C5; --info-soft:#EAF2FB;
  --neutral:#3A5273; --neutral-soft:#EEF3F8; --muted-badge:#7A8CA3; --muted-soft:#F2F5F9;
  --danger:#B42840; --danger-soft:#FBEAED;
  --tile-food:#FAF4EE; --tile-food-ink:#9A5A2E; --tile-home:#F5F3FA; --tile-home-ink:#5E4E96;
  --tile-drink:#F0F6F3; --tile-drink-ink:#2D6B53; --tile-outdoors:#F0F4F9; --tile-outdoors-ink:#2F5B8A;
  --brand:#0E7C74; --brand-ink:#FFFFFF; --brand-soft:#E3F2F0;
  --scrim:rgba(11,27,63,.4);
  --shadow:0 1px 2px rgba(11,27,63,.05),0 8px 24px rgba(11,27,63,.06);
  --font-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-lg:18px;
}
/* One light theme on purpose, matching the reference look; it ignores the viewer's dark mode. */
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--font-display);color:var(--ink);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:clamp(26px,3.2vw,34px);font-weight:700;line-height:1.15}
h2{font-size:19px;font-weight:700;line-height:1.25}
h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stack-4,.stack-8,.stack-12,.stack-16,.stack-20,.stack-24{display:flex;flex-direction:column}
.stack-4{gap:4px}.stack-8{gap:8px}.stack-12{gap:12px}.stack-16{gap:16px}.stack-20{gap:20px}.stack-24{gap:24px}
.row-8{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.center{text-align:center;align-items:center}
.block{width:100%}
.ic{flex:none}

/* App switcher */
.proto-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:16px;white-space:nowrap;letter-spacing:-.01em}
.wordmark .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.app-switch{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px;overflow-x:auto;max-width:100%}
.app-switch button{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.app-switch button:hover{color:var(--ink)}
.app-switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.proto-pill{margin-left:auto;font-size:12px;font-weight:600;color:var(--pop);border:1px solid currentColor;border-radius:999px;padding:3px 10px;white-space:nowrap}

/* Sender shell */
.sender{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 57px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(57px + env(safe-area-inset-top,0px));height:calc(100vh - 57px);overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;text-align:left;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav button[aria-current="page"] .ic{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line)}
.side-foot .v{font-family:var(--font-display);font-weight:700;font-size:20px}
.canvas{padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);min-width:0}
@media (min-width:901px){.canvas{padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}}
.page{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.page.narrow{max-width:760px}
@media (max-width:900px){
  .sender{grid-template-columns:1fr}
  .side{position:sticky;top:calc(var(--bar-h,57px) + env(safe-area-inset-top,0px));z-index:40;height:auto;flex-direction:row;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .nav{flex-direction:row}
  .side-foot{display:none}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:10px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.lg{padding:12px 22px;font-size:15px;border-radius:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.static{cursor:default}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13.5px;font-weight:600}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input[aria-invalid="true"]{border-color:var(--danger)}
textarea.input{resize:vertical;line-height:1.5}
.err{color:var(--danger);font-size:12.5px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .input{padding-left:36px}
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);border:0;flex:none;transition:background .15s;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.card.raised{box-shadow:var(--shadow);border-color:transparent}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.danger{background:var(--danger-soft);color:var(--danger)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert b{display:block}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;text-transform:capitalize}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.neutral{background:var(--neutral-soft);color:var(--neutral)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.muted{background:var(--muted-soft);color:var(--muted-badge)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}

/* Home */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.hello h1{font-size:clamp(30px,4.2vw,42px);font-weight:800;letter-spacing:-.025em}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:12px 12px 16px;transition:transform .15s,box-shadow .15s;min-width:0}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .art{height:92px;border-radius:12px;display:grid;place-items:center}
.tile b{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:4px;padding-inline:4px}
.tile span.d{font-size:12.5px;color:var(--ink-2);padding-inline:4px}
.art.a,.art.b,.art.c,.art.d,.art.e{background:var(--surface-2);color:var(--ink)}
.tile .art.a{color:var(--accent)}
.moment-ico.art{color:var(--ink-2)}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile.hero{grid-column:span 2}}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--ink-2)}
.stat.lead{border-color:var(--ink-3)}
.stat.lead .v{color:var(--ink)}
@media (max-width:760px){.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.stats{grid-template-columns:1fr}}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.coll{scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:12px;min-width:0;transition:box-shadow .15s}
.coll:hover{box-shadow:var(--shadow)}
.coll .meta{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px}
.mosaic{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px;border-radius:12px;background:var(--surface-2)}
.mosaic .pt{aspect-ratio:1;border-radius:8px}
.mosaic .pt.empty{background:var(--surface)}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column}
.list > *{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list > *:last-child{border-bottom:0}
.mini-bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;width:72px;flex:none}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.moment-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}

/* Products */
.pt{display:grid;place-items:center;border-radius:12px}
.pt.food{background:var(--tile-food);color:var(--tile-food-ink)}
.pt.home{background:var(--tile-home);color:var(--tile-home-ink)}
.pt.drink{background:var(--tile-drink);color:var(--tile-drink-ink)}
.pt.outdoors{background:var(--tile-outdoors);color:var(--tile-outdoors-ink)}
.filters{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center}
@media (max-width:620px){.frow{grid-template-columns:1fr;gap:6px}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-width:0;transition:box-shadow .15s}
.pcard:hover{box-shadow:var(--shadow)}
.pcard .pt{aspect-ratio:4/3;border-radius:0;border:0;width:100%;max-width:100%}
.pcard .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.brand{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.pname{font-weight:600;line-height:1.3}
.price{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;gap:8px}
.empty-state{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:40px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.create-card{border:1.5px dashed var(--ink-3);background:transparent;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;color:var(--accent);font-weight:600;min-height:220px}
.create-card:hover{background:var(--accent-soft);border-color:var(--accent)}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}

/* Send flow */
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 14px 6px 6px;border-radius:999px;color:var(--ink-3);font-weight:600;font-size:14px}
.stepper .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:12.5px}
.stepper button[aria-current="step"]{color:var(--accent);background:var(--accent-soft)}
.stepper button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper button.done{color:var(--ok)}
.stepper button.done .n{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.stepper button[disabled]{cursor:not-allowed}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.flow aside{position:sticky;top:84px}
@media (max-width:1040px){.flow{grid-template-columns:1fr}.flow aside{position:static}}
.flow-nav{display:flex;justify-content:space-between;gap:12px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px;width:100%}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent);flex:none;border:1px solid var(--line)}
.choice b{display:block;margin-bottom:2px}
.pick{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px 10px 10px;width:100%}
.pick:hover{border-color:var(--ink-3)}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick .pt{width:46px;height:46px;flex:none;border-radius:10px}
.pick .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.pick[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:700px){.picks{grid-template-columns:1fr}}
.people{display:flex;flex-direction:column;max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.person{display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.person:last-child{border-bottom:0}
.person:hover{background:var(--surface-2)}
.person .tick{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-3);display:grid;place-items:center;flex:none;color:transparent}
.person[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.chan-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chan{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;min-width:0}
.chan:hover{border-color:var(--ink-3)}
.chan[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chan[aria-pressed="true"] > .ic{color:var(--accent)}
.chan b{display:block;font-size:14px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:72px;height:50px;border-radius:12px;border:2px solid var(--line);padding:0}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.review{margin:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px}
.review > div{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.review > div:last-child{border-bottom:0}
.review dt{font-size:13px;color:var(--ink-2);font-weight:600}
.review dd{margin:0;min-width:0}

function seedCampaign(c,k,offset){
  const st=[];const push=(s,n)=>{for(let i=0;i<n;i++)st.push(s);};
  if(k.scheduled) push('scheduled',k.scheduled);
  else if(k.pending) push('pending approval',k.pending);
  else{
    push('delivered',k.delivered);push('shipped',k.shipped-k.delivered);
    const ro=k.redeemed-k.shipped;push('redeeming',ro>=2?1:0);push('redeemed',ro>=2?ro-1:ro);
    push('expired',k.expired);push('opened',k.opened-k.redeemed);push('sent',k.sent-k.opened-k.expired);
  }
  const order=st.map((s,i)=>({s,k:((i+1)*2654435761>>>0)%9973})).sort((a,b)=>a.k-b.k).map(x=>x.s);
  const pool=itemsFor(c.collection,c.budget);
  c.gifts=order.map((s,i)=>{const n=personName(offset+i);const chose=['redeeming','redeemed','shipped','delivered'].includes(s);
    return{id:'g_'+rand(6),name:n,email:emailOf(n),status:s,channel:c.channels[i%c.channels.length],sku:chose?pool[i%pool.length].sku:null};});
  return c;
}

function drawQR(){
  const cv=$('#qr');if(!cv)return;const ctx=cv.getContext('2d');const cs=getComputedStyle(document.documentElement);
  const fg=cs.getPropertyValue('--ink').trim(),bg=cs.getPropertyValue('--surface').trim();
  const N=29,q=2,cell=cv.width/(N+q*2);ctx.fillStyle=bg;ctx.fillRect(0,0,cv.width,cv.height);
  let seed=[...S.send.done.token].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
  const finder=(x,y)=>x<8&&y<8||x>=N-8&&y<8||x<8&&y>=N-8;ctx.fillStyle=fg;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(finder(x,y))continue;if(rnd()<.48)ctx.fillRect((x+q)*cell,(y+q)*cell,cell+.5,cell+.5);}
  for(const [fx,fy] of [[0,0],[N-7,0],[0,N-7]]){const px=(fx+q)*cell,py=(fy+q)*cell;ctx.fillStyle=fg;ctx.fillRect(px,py,7*cell,7*cell);ctx.fillStyle=bg;ctx.fillRect(px+cell,py+cell,5*cell,5*cell);ctx.fillStyle=fg;ctx.fillRect(px+2*cell,py+2*cell,3*cell,3*cell);}
}

function renderModal(){
  const root=$('#modal-root');if(!S.modal){root.innerHTML='';return;}
  const focusId=document.activeElement&&root.contains(document.activeElement)?document.activeElement.id:null;
  const m=MODALS[S.modal.kind](S.modal);
  root.innerHTML=`<div class="scrim" data-act="modal-scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="modal-head"><h2 id="m-title">${esc(m.title)}</h2><button type="button" class="icon-btn" data-act="modal-close" aria-label="Close">${ic('x',18)}</button></div>${m.body}
    <div class="modal-actions">${m.actions.map(a=>`<button type="button" class="btn ${a.kind||''}" data-act="${a.act}" ${attrs(a.data)} ${a.disabled?'disabled':''}>${a.label}</button>`).join('')}</div></div></div>`;
  if(focusId&&$('#'+focusId)){const el=$('#'+focusId);el.focus();if(el.setSelectionRange&&el.value!=null)el.setSelectionRange(el.value.length,el.value.length);}
}
const openModal=(kind,data={})=>{S.modal={kind,...data};renderModal();const f=$('#modal-root .modal input, #modal-root .modal button');f&&f.focus();};
const closeModal=()=>{S.modal=null;renderModal();};

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){err.textContent='Enter an email address like name@company.example.';err.hidden=false;inp.setAttribute('aria-invalid','true');inp.focus();return;}
  let p=DIRECTORY.find(x=>x.email===v);if(!p){p={id:'p'+DIRECTORY.length,name:v.split('@')[0].replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),email:v,dept:'Added'};DIRECTORY.push(p);}
  if(!S.send.recipients.includes(p.id))S.send.recipients.push(p.id);render();toast(`${p.name} added.`);const n=$('#f-add');n&&n.focus();}

  'm-name'(el){S.modal.name=el.value;renderModal();},
  'm-field'(el){S.modal[el.dataset.k]=el.value;},
};

  team(el){S.team=el.value;S.campaign=null;render();},
  vendor(el){S.vendor=el.value;render();},
  'send-date'(el){S.send.date=el.value;render();},
  'send-expiry'(el){S.send.expiry=+el.value;render();},
  'rec-country'(el){S.rec.addr.country=el.value;},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn)fn(el.dataset,el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.modal){closeModal();return;}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter==='add-email'){e.preventDefault();addEmail();}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('tr.click')){e.target.closest('tr.click').click();}
});
addEventListener('resize',()=>document.documentElement.style.setProperty('--bar-h',$('#proto-bar').offsetHeight+'px'));
